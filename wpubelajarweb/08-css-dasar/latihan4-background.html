<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>

   <style>

    body {
        font-family:'Courier New', Courier, monospace;
        font-weight: bold;
        color:#000000;
        text-align: center;
        background-color: #db9bb0;
        background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.6)), url(img/embun.jpg);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
    }

    h2 {
        font-size: 4em;
        text-align:center;
        font-family: "Times New Roman", serif;
        letter-spacing: 5px;
         text-transform: uppercase;
        text-decoration: none;
        background-image: linear-gradient(to right, #44a5d5, #7b2a90);
        background-clip: text;
        color: transparent;
        filter: drop-shadow(2px 2px 2px rgba(236, 231, 231, 0.5));


    }

    .quote {
        font-size: 25px;
        font-family: "courier New", Courier, monospace;
        color:rgb(141, 137, 137);
        text-align: justify;
        text-indent: 50px;
        line-height: 50px;
        white-space: wrap;
        background-color: rgba(0, 0, 0, 0.3);
        padding: 10px;
        margin: auto;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.5);
    }

    .autor {
        font-size: 12px;
        letter-spacing: 5px;
        color:rgb(127, 125, 125);
        font-weight: normal;
        text-transform: uppercase;
        border-top: 1px solid rgba(255, 255, 255, 0.5);
        margin-top: 10px;
        padding-top: 20px;
        
        
    }

   </style>
    </style>
</head>
<body>
    <h2>Tentang Hati Yang Bertahan</h2>
    <p class="quote">"Tidak semua luka perlu diceritakan. Ada hati yang memilih tersenyum, bukan karena tak pernah merasa sakit, melainkan karena ia masih percaya bahwa hari esok bisa membawa alasan baru untuk bertahan."</p>
    <p class="autor">-febbrriee</p>
    
</body>
</html>
