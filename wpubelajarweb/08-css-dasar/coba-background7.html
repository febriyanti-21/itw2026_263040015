<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Background</title>

    <style>
        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #86d6ea;
        }

        .frame {
            width: 400px;
            height: 400px;
            margin: 0 auto;
            border: 10px solid white;
            margin:auto;
            background-image: url(img/febrie.png), url(img/bunga.png), url(img/glmbg.png);
            background-size: 400px, 500px, 600px;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-position: center bottom, center 100%, center 60px;
            background-color: rgb(10, 3, 48);
            border-radius: 50px;
        }

        h1 {
            color: white;
            text-align: center;
            font-family:'Courier New', Courier, monospace;
            font-size: 30px;
            text-shadow: 2px 2px 4px #000000;
        }
    </style>
</head>
<body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
</body>
</html>
