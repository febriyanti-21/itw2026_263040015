<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>

    <style>
        body {
            background-color: #86d6ea;
            background-image: linear-gradient(to right, #86d6ea, #f5b7b1);
        }

        .Kotak1{
            width: 300px;
            height: 300px;
            background-color:darkgoldenrod;
            background-image: linear-gradient(to right, darkgoldenrod, #f5b7b1);
        }

        .Kotak2{
            width: 300px;
            height: 300px;
            background-color:lightcoral;
            background-image: radial-gradient(circle, rgb(237, 12, 12), #f5b7b1);
        }

        .Kotak3{
            width: 300px;
            height: 300px;
            background-color:rgb(144, 218, 238);
            background-image: conic-gradient(rgb(26, 95, 117), #f5b7b1);
        }
    </style>
</head>

<body>
    <div class="Kotak1"></div>
    <div class="Kotak2"></div>
    <div class="Kotak3"></div>
    
</body>
</html>
