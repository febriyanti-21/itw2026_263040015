<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>

   <style>

    body {
        font-family:'Courier New', Courier, monospace;
        font-weight: bold;
        color:rgb(59, 57, 57);
        text-align: center;
    }

    h2 {
        font-size: 40px;
        text-align:center;
        font-family: "Times New Roman", serif;
        letter-spacing: 5px;
         text-transform: uppercase;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-decoration-color: rgb(113, 120, 120);
        text-shadow: 5px 5px 5px rgb(88, 85, 85);
        text-decoration-skip-ink: none;


    }

    .quote {
        font-size: 25px;
        font-family: "courier New", Courier, monospace;
        color:gray;
        text-align: justify;
        text-indent: 50px;
        line-height: 50px;
        white-space: wrap;
    }

    .autor {
        font-size: 12px;
        letter-spacing: 5px;
        color:rgb(127, 126, 126);
        font-weight: normal;
        
    }

   </style>
    </style>
</head>
<body>
    <h2>Tentang Hati Yang Bertahan</h2>
    <p class="quote">"Tidak semua luka perlu diceritakan. Ada hati yang memilih tersenyum, bukan karena tak pernah merasa sakit, melainkan karena ia masih percaya bahwa hari esok bisa membawa alasan baru untuk bertahan."</p>
    <p class="autor">-febbrriee</p>
    
</body>
</html>
